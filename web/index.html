<title>Trợ lý tuyển dụng</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #f4f3ee;
    --text: #1f1e1c;
    --muted: #77746c;
    --muted-weak: #a8a599;
    --border: #e4e1d6;
    --surface: #ffffff;
    --hover: #ebe8de;
    --accent: #c15f3c;
    --accent-weak: #e7d3ca;
    --danger: #a1402c;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #262624;
      --text: #ece8df;
      --muted: #96938a;
      --muted-weak: #6b685f;
      --border: #3a382f;
      --surface: #2e2c28;
      --hover: #363430;
      --accent: #d97757;
      --accent-weak: #4a3830;
      --danger: #e08669;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
    display: grid;
    grid-template-columns: auto 1fr;
    height: 100vh;
    overflow: hidden;
  }

  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  button { font: inherit; color: inherit; }

  /* ---------- Sidebar ---------- */

  .sidebar {
    width: 64px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 0;
    transition: margin-left 0.2s ease;
  }

  .sidebar.hidden { margin-left: -64px; }

  .rail-btn {
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    cursor: pointer;
    margin-bottom: 4px;
  }

  .rail-btn:hover { background: var(--hover); color: var(--text); }
  .rail-btn.inert { opacity: 0.42; cursor: default; }
  .rail-btn.inert:hover { background: transparent; color: var(--muted); }
  .rail-btn svg { width: 19px; height: 19px; }

  .rail-gap { flex: 1 1 auto; }

  .rail-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 0.72rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 6px;
  }

  /* ---------- Main column ---------- */

  .main-col {
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 100vh;
  }

  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
  }

  .topbar-title {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text);
  }

  .topbar-title svg { width: 14px; height: 14px; color: var(--muted); }

  .menu-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: none;
    padding: 4px;
    margin-right: 6px;
  }

  .share-btn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 0.82rem;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
  }

  .share-btn:hover { background: var(--hover); }

  /* ---------- Thread ---------- */

  main { flex: 1 1 auto; overflow-y: auto; }

  #thread {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 24px 16px;
  }

  .empty-state {
    text-align: center;
    padding: 60px 0 20px;
  }

  .mark { display: inline-block; color: var(--accent); }
  .mark svg { width: 34px; height: 34px; }
  .mark.small svg { width: 15px; height: 15px; }

  .empty-state .empty-text {
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 14px;
  }

  .turn {
    margin-bottom: 34px;
    opacity: 0;
    animation: fadeIn 0.3s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .user-row { display: flex; justify-content: flex-end; margin-bottom: 20px; }

  .user-bubble {
    background: var(--hover);
    border-radius: 14px;
    padding: 10px 14px;
    max-width: 85%;
    font-size: 0.94rem;
    white-space: pre-wrap;
  }

  .reply-head {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
  }

  .reply-label {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
  }

  .reply-body {
    font-size: 0.95rem;
    white-space: pre-wrap;
  }

  .reply-body h1, .reply-body h2, .reply-body h3 {
    font-size: 1rem;
    margin: 16px 0 6px;
  }

  .reply-body p, .obs p, .thought-text p {
    margin: 0 0 10px;
  }

  .reply-body p:last-child, .obs p:last-child, .thought-text p:last-child {
    margin-bottom: 0;
  }

  .reply-body ul, .reply-body ol, .obs ul, .obs ol, .thought-text ul, .thought-text ol {
    margin: 0 0 10px;
    padding-left: 22px;
  }

  .reply-body ul:last-child, .reply-body ol:last-child, .obs ul:last-child, .obs ol:last-child {
    margin-bottom: 0;
  }

  .reply-body li, .obs li, .thought-text li {
    margin-bottom: 4px;
  }

  .reply-body h4, .obs h4, .thought-text h4 {
    font-size: 0.95rem;
    font-weight: 700;
    margin: 14px 0 6px;
  }

  .reply-body strong, .obs strong, .thought-text strong {
    font-weight: 700;
  }

  .reply-body code, .obs code, .thought-text code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    background: var(--hover);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 0.85em;
  }

  .status-line {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 4px 0 10px;
  }

  .actions-row {
    display: flex;
    gap: 2px;
    margin-top: 10px;
  }

  .icon-btn {
    width: 30px;
    height: 30px;
    border: none;
    background: transparent;
    border-radius: 7px;
    color: var(--muted-weak);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .icon-btn:hover { background: var(--hover); color: var(--muted); }
  .icon-btn svg { width: 15px; height: 15px; }

  details.trace {
    margin-top: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
  }

  details.trace summary {
    cursor: pointer;
    font-size: 0.82rem;
    color: var(--muted);
    user-select: none;
  }

  .trace-step {
    border-left: 2px solid var(--border);
    padding: 6px 0 6px 12px;
    margin: 10px 0 0 4px;
    font-size: 0.86rem;
  }

  .trace-step.error { border-left-color: var(--danger); }

  .trace-step .label {
    color: var(--muted);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
  }

  .trace-step .action-code {
    display: inline-block;
    background: var(--hover);
    border-radius: 5px;
    padding: 2px 6px;
    font-size: 0.82rem;
  }

  .trace-step.error .obs { color: var(--danger); }

  .live::after {
    content: "▍";
    animation: blink 0.9s steps(1) infinite;
    color: var(--accent);
  }

  @keyframes blink { 50% { opacity: 0; } }

  .error-banner {
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.88rem;
  }

  /* ---------- Composer ---------- */

  .composer-wrap { flex: 0 0 auto; padding: 0 24px 10px; }

  .composer-inner { max-width: 760px; margin: 0 auto; }

  form.composer {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 10px 10px 8px 16px;
    box-shadow: 0 8px 24px -20px rgba(0, 0, 0, 0.4);
  }

  textarea {
    width: 100%;
    border: none;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 0.94rem;
    resize: none;
    outline: none;
    max-height: 160px;
    padding: 2px 0 8px;
  }

  textarea::placeholder { color: var(--muted-weak); }

  .composer-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .composer-left, .composer-right {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .tool-btn {
    width: 32px;
    height: 32px;
    border: 1px solid var(--border);
    background: transparent;
    border-radius: 50%;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .tool-btn:hover { background: var(--hover); }
  .tool-btn svg { width: 15px; height: 15px; }

  .model-tag {
    font-size: 0.78rem;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 10px;
    white-space: nowrap;
  }

  .mic-btn { border: none; background: transparent; color: var(--muted-weak); width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
  .mic-btn svg { width: 16px; height: 16px; }

  .send-btn {
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .send-btn:disabled { opacity: 0.45; cursor: progress; }
  .send-btn svg { width: 15px; height: 15px; }

  textarea:focus-visible, .icon-btn:focus-visible, .tool-btn:focus-visible,
  .send-btn:focus-visible, .rail-btn:focus-visible, .share-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .disclaimer {
    text-align: center;
    font-size: 0.72rem;
    color: var(--muted-weak);
    padding: 8px 0 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .turn { animation: none !important; opacity: 1 !important; }
    .live::after { animation: none; }
  }

  @media (max-width: 720px) {
    .sidebar { position: fixed; z-index: 5; background: var(--bg); height: 100vh; }
    .sidebar:not(.open) { margin-left: -64px; }
    .menu-btn { display: inline-flex; }
    .composer-wrap, #thread { padding-left: 14px; padding-right: 14px; }
  }
</style>

<div class="sidebar" id="sidebar">
  <button class="rail-btn" id="sidebarToggle" title="Ẩn/hiện thanh bên">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="14" height="12" rx="2"/><line x1="8" y1="4" x2="8" y2="16"/></svg>
  </button>
  <button class="rail-btn" id="newChatBtn" title="Cuộc trò chuyện mới">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="10" y1="4" x2="10" y2="16"/><line x1="4" y1="10" x2="16" y2="10"/></svg>
  </button>
  <button class="rail-btn inert" title="Lịch sử trò chuyện (chưa mở trong bản demo)">

  </button>
  <button class="rail-btn inert" title="Mã nguồn (chưa mở trong bản demo)">

  </button>
  <div class="rail-gap"></div>
  <button class="rail-btn inert" title="Việc của tôi (chưa mở trong bản demo)">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="14" height="9" rx="1.5"/><path d="M7 7V5.5A1.5 1.5 0 0 1 8.5 4h3A1.5 1.5 0 0 1 13 5.5V7"/></svg>
  </button>
  <div class="rail-avatar">HR</div>
</div>

<div class="main-col">
  <div class="topbar">
    <div style="display:flex;align-items:center">
      <button class="menu-btn" id="menuBtn" title="Menu">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" style="width:18px;height:18px"><line x1="3" y1="6" x2="17" y2="6"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="14" x2="17" y2="14"/></svg>
      </button>
      <span class="topbar-title">Trợ lý tuyển dụng &amp; hẹn phỏng vấn
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 8l5 5 5-5"/></svg>
      </span>
    </div>
    <button class="share-btn" id="shareBtn">Chia sẻ</button>
  </div>

  <main>
    <div id="thread">
      <div class="empty-state" id="emptyState">
        <span class="mark">
          <svg viewBox="0 0 40 40" fill="currentColor"><path d="M20 2c1 5 3 9 6 12s7 5 12 6c-5 1-9 3-12 6s-5 7-6 12c-1-5-3-9-6-12s-7-5-12-6c5-1 9-3 12-6s5-7 6-12z"/></svg>
        </span>
        <p class="empty-text">Hỏi bất kỳ điều gì về sàng lọc hồ sơ hoặc xếp lịch phỏng vấn.</p>

  <div class="composer-wrap">

        <textarea id="questionInput" rows="1" placeholder="Nhắn tin cho trợ lý..."></textarea>
        <div class="composer-toolbar">
          <div class="composer-left">
            <button type="button" class="tool-btn inert" title="Đính kèm (chưa hỗ trợ trong bản demo)">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="10" y1="5" x2="10" y2="15"/><line x1="5" y1="10" x2="15" y2="10"/></svg>
            </button>

              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7.5" y="3" width="5" height="9" rx="2.5"/><path d="M5 10a5 5 0 0 0 10 0M10 15v2"/></svg>

      <p class="disclaimer">Trợ lý dùng AI và có thể trả lời sai. Luôn kiểm tra lại thông tin quan trọng.</p>

</div>

<script>
  const sidebar = document.getElementById("sidebar");
  const thread = document.getElementById("thread");
  const emptyState = document.getElementById("emptyState");
  const form = document.getElementById("composerForm");
  const input = document.getElementById("questionInput");
  const sendBtn = document.getElementById("sendBtn");
  const modelTag = document.getElementById("modelTag");
  const shareBtn = document.getElementById("shareBtn");

  document.getElementById("sidebarToggle").addEventListener("click", () => sidebar.classList.toggle("hidden"));
  document.getElementById("menuBtn").addEventListener("click", () => sidebar.classList.toggle("open"));
  document.getElementById("newChatBtn").addEventListener("click", () => {
    thread.innerHTML = "";
    thread.appendChild(emptyState);
  });
  shareBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(location.href);
      const original = shareBtn.textContent;
      shareBtn.textContent = "Đã sao chép liên kết";
      setTimeout(() => (shareBtn.textContent = original), 1600);
    } catch (e) {
      /* clipboard unavailable, silently ignore */
    }
  });

  function escapeHtml(s) {
    return (s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function stripIcons(s) {
    return (s ?? "")
      .replace(/\p{Extended_Pictographic}/gu, "")
      .replace(/[ \t]{2,}/g, " ")
      .replace(/^\s+|\s+$/gm, "")
      .trim();
  }

  // Chỉ bỏ emoji, KHÔNG đụng khoảng trắng — dùng khi cộng dồn từng mẩu chunk đang stream,
  // vì stripIcons() (có trim) sẽ ăn mất dấu cách ở đầu/cuối mỗi chunk nhỏ, làm chữ dính liền nhau.
  function stripEmoji(s) {
    return (s ?? "").replace(/\p{Extended_Pictographic}/gu, "");
  }

  function clean(s) { return escapeHtml(stripIcons(s)); }

  function renderInline(s) {
    let out = s
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/__(.+?)__/g, "<strong>$1</strong>")
      .replace(/`([^`]+)`/g, "<code>$1</code>");
    out = out.replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>");
    return out;
  }

  // Markdown -> HTML: tự động xử lý xuống dòng cho danh sách & các dòng văn bản
  function renderMarkdown(raw) {
    if (!raw) return "";
    // Tự động chèn xuống dòng trước các con số thứ tự bị dính liền (vd: "sau:1. ... kỹ năng.2. ...")
    let formatted = raw.replace(/([:.\?\!a-zA-ZÀ-ỹ])\s*(\d+[.)]\s+)/g, "$1\n$2");
    
    const text = escapeHtml(stripIcons(formatted));
    const lines = text.split("\n");
    let html = "";
    let listType = null;
    let para = [];

    const flushPara = () => {
      if (para.length) {
        html += `<p>${para.map(renderInline).join("<br>")}</p>`;
        para = [];
      }
    };
    const closeList = () => {
      if (listType) { html += `</${listType}>`; listType = null; }
    };

    for (const rawLine of lines) {
      const line = rawLine.trim();
      if (!line) { flushPara(); closeList(); continue; }

      const heading = line.match(/^#{1,4}\s+(.*)$/);
      const numbered = line.match(/^(\d+)[.)]\s+(.*)$/);
      const bulleted = line.match(/^[-*•]\s+(.*)$/);

      if (heading) {
        flushPara(); closeList();
        html += `<h4>${renderInline(heading[1])}</h4>`;
      } else if (numbered) {
        flushPara();
        if (listType !== "ol") { closeList(); html += "<ol>"; listType = "ol"; }
        html += `<li>${renderInline(numbered[2])}</li>`;
      } else if (bulleted) {
        flushPara();
        if (listType !== "ul") { closeList(); html += "<ul>"; listType = "ul"; }
        html += `<li>${renderInline(bulleted[1])}</li>`;
      } else {
        closeList();
        para.push(line);
      }
    }
    flushPara();
    closeList();
    return html;
  }


  async function loadMeta() {
    try {
      const prov = await fetch("/api/provider").then((r) => r.json());
      modelTag.textContent = clean(prov.model);
    } catch (e) {
      modelTag.textContent = "ngoại tuyến";
    }
  }

  function scrollToEnd(el) { el.scrollIntoView({ behavior: "smooth", block: "end" }); }

  function buildTurnSkeleton(question) {
    if (emptyState.isConnected) emptyState.remove();
    const el = document.createElement("div");
    el.className = "turn";
    el.innerHTML = `
      <div class="user-row"><div class="user-bubble">${clean(question)}</div></div>
      <div class="reply-head">
        <span class="mark small"><svg viewBox="0 0 40 40" fill="currentColor"><path d="M20 2c1 5 3 9 6 12s7 5 12 6c-5 1-9 3-12 6s-5 7-6 12c-1-5-3-9-6-12s-7-5-12-6c5-1 9-3 12-6s5-7 6-12z"/></svg></span>
        <span class="reply-label">Trợ lý</span>
      </div>
      <div class="status-line agent-status">Đang suy nghĩ...</div>
      <details class="trace agent-steps">
        <summary>Quá trình xử lý</summary>
      </details>
      <div class="reply-body agent-final" style="display:none"></div>
      <div class="actions-row agent-actions" style="display:none">
        <button type="button" class="icon-btn" title="Sao chép" data-action="copy">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="6" y="6" width="10" height="11" rx="1.5"/><path d="M4 13.5V4.5A1.5 1.5 0 0 1 5.5 3H13"/></svg>
        </button>
        <button type="button" class="icon-btn inert" title="Nghe (chưa hỗ trợ)">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 8v4h3l4 3V5L7 8H4z"/><path d="M14 7a4 4 0 0 1 0 6"/></svg>
        </button>
        <button type="button" class="icon-btn inert" title="Câu trả lời hữu ích (chưa hỗ trợ)">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 8V5a2 2 0 0 1 4 0v3h3.5a1.5 1.5 0 0 1 1.45 1.86l-1 4A1.5 1.5 0 0 1 14.5 15H6V8h2z"/><path d="M6 8H4v7h2"/></svg>
        </button>
        <button type="button" class="icon-btn inert" title="Câu trả lời chưa tốt (chưa hỗ trợ)">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 12v3a2 2 0 0 1-4 0v-3H4.5A1.5 1.5 0 0 1 3.05 10.14l1-4A1.5 1.5 0 0 1 5.5 5H14v7h-2z"/><path d="M14 12h2V5h-2"/></svg>
        </button>
        <button type="button" class="icon-btn" title="Hỏi lại" data-action="retry">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 6a6 6 0 1 0 1.6 5.8"/><path d="M16 3v4h-4"/></svg>
        </button>
      </div>`;
    thread.appendChild(el);
    scrollToEnd(el);

    el.querySelector('[data-action="copy"]').addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(finalEl.textContent); } catch (e) {}
    });
    const finalEl = el.querySelector(".agent-final");
    el.querySelector('[data-action="retry"]').addEventListener("click", () => {
      input.value = question;
      form.requestSubmit();
    });

    return {
      root: el,
      agentStatus: el.querySelector(".agent-status"),
      agentSteps: el.querySelector(".agent-steps"),
      agentFinal: finalEl,
      agentActions: el.querySelector(".agent-actions"),
    };
  }

  function makeStepEl(stepNum) {
    const div = document.createElement("div");
    div.className = "trace-step";
    div.innerHTML = `
      <div class="label">Bước ${stepNum} — suy nghĩ</div>
      <div class="thought-text live"></div>
      <div class="action-area"></div>`;
    return div;
  }

  function fillStepResult(stepEl, ev) {
    stepEl.querySelector(".thought-text").classList.remove("live");
    if (ev.is_error) stepEl.classList.add("error");
    const actionArea = stepEl.querySelector(".action-area");
    const actionLine = ev.action
      ? `<div><span class="label">Hành động (tool được chọn)</span><br><span class="action-code mono">${clean(ev.action)}</span></div>`
      : "";
    actionArea.innerHTML = `
      ${actionLine}
      <div style="margin-top:6px">
        <div class="label">${ev.is_error ? "Lỗi từ công cụ" : "Kết quả"}</div>
        <div class="obs">${renderMarkdown(ev.observation)}</div>
      </div>`;
  }

  async function streamAgent(question, refs) {
    const res = await fetch("/api/compare/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    if (!res.ok || !res.body) throw new Error("bad status");

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let stepCount = 0;
    let currentStepEl = null;
    let fastRaw = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.trim()) continue;
        const ev = JSON.parse(line);

        if (ev.type === "fast_chunk") {
          refs.agentStatus.style.display = "none";
          refs.agentSteps.remove();
          refs.agentFinal.style.display = "";
          refs.agentFinal.classList.add("live");
          fastRaw += stripEmoji(ev.text);
          refs.agentFinal.innerHTML = renderMarkdown(fastRaw);
        } else if (ev.type === "fast_done") {
          refs.agentFinal.classList.remove("live");
          refs.agentActions.style.display = "";
        } else if (ev.type === "route_tool") {
          refs.agentStatus.textContent = "Câu hỏi cần dữ liệu thực tế — đang dùng công cụ...";
        } else if (ev.type === "step_start") {
          stepCount = ev.step;
          refs.agentStatus.textContent = `Đang suy nghĩ — bước ${ev.step}...`;
          currentStepEl = makeStepEl(ev.step);
          refs.agentSteps.appendChild(currentStepEl);
        } else if (ev.type === "thought_chunk") {
          if (currentStepEl) {
            currentStepEl._raw = (currentStepEl._raw || "") + stripEmoji(ev.text);
            currentStepEl.querySelector(".thought-text").innerHTML = renderMarkdown(currentStepEl._raw);
          }
        } else if (ev.type === "step_done" || ev.type === "step_error") {
          if (currentStepEl) fillStepResult(currentStepEl, ev);
          refs.agentStatus.textContent = ev.action
            ? `Đã gọi công cụ: ${ev.action.split("[")[0]}`
            : "Định dạng chưa đúng, đang thử lại...";
        } else if (ev.type === "final") {
          refs.agentStatus.style.display = "none";
          const summary = refs.agentSteps.querySelector("summary");
          if (stepCount > 0) {
            summary.textContent = `Quá trình xử lý (${stepCount} bước)`;
          } else {
            refs.agentSteps.remove();
          }
          refs.agentFinal.style.display = "";
          refs.agentFinal.innerHTML = renderMarkdown(ev.final_answer);
          refs.agentActions.style.display = "";
          if (ev.guardrail_triggered) {
            const warn = document.createElement("div");
            warn.className = "status-line";
            warn.style.color = "var(--danger)";
            warn.textContent = "Đã chạm giới hạn số bước xử lý trước khi có câu trả lời chắc chắn.";
            refs.agentFinal.insertAdjacentElement("afterend", warn);
          }
        }
        scrollToEnd(refs.root);
      }
    }
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    input.value = "";
    autosize();
    sendBtn.disabled = true;

    const refs = buildTurnSkeleton(question);

    try {
      await streamAgent(question, refs);
    } catch (err) {
      refs.root.insertAdjacentHTML("beforeend", `<div class="error-banner">Không kết nối được tới server demo. Kiểm tra terminal đang chạy <code>python src/web_app.py</code> chưa, rồi thử lại.</div>`);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  loadMeta();
</script>
